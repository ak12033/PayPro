name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch cancels the previous run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: API — tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci

      # Blocking. Fails if git tracks an env/credential file or any tracked
      # file contains a private key (plan.md §4.13). Needs no secrets itself.
      - name: Secret hygiene
        run: npm run secrets:check

      # The suite spins up its own in-memory replica set via
      # mongodb-memory-server, so no service container is needed.
      - name: Run tests
        run: npm test
        env:
          NODE_ENV: test
          JWT_SECRET: ci-secret-that-is-at-least-32-characters-long

  client:
    name: Web — lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci

      - name: Lint
        run: npx eslint src --ext .js,.jsx --max-warnings 20

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
        env:
          VITE_BACKEND_URL: https://api.example.com

  ai:
    name: AI service — lint & tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fastapi-server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            fastapi-server/requirements.txt
            fastapi-server/requirements-dev.txt

      # Pulls in requirements.txt too, so this also proves the pinned
      # production set installs cleanly.
      - run: pip install -r requirements-dev.txt

      - name: Compile check
        run: python -m compileall -q app

      - name: Lint
        run: ruff check .

      # Proves the app actually constructs (routes register, deps resolve)
      # rather than only that the files parse.
      - name: Import app
        run: python -c "from app.main import app; print(f'{len(app.routes)} routes registered')"
        env:
          GEMINI_API_KEY: ci-placeholder
          JWT_SECRET: ci-placeholder-secret-at-least-32-characters
          MONGO_URI: mongodb://localhost:27017
          ENVIRONMENT: development

      # The suite stubs every Gemini call AND the database, so no API key is
      # consumed and no MongoDB service is needed.
      - name: Tests
        run: pytest

  # End-to-end (plan.md §43.6): the real SPA driven by Playwright against the
  # real API and an in-memory MongoDB replica set, all started by
  # e2e/playwright.config.js. No secrets and no external services: the AI
  # service is absent (both calls fail open) and mail is printed, not sent.
  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: [server, client]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json
            e2e/package-lock.json

      - run: npm ci
        working-directory: server
      - run: npm ci
        working-directory: client
      - run: npm ci
        working-directory: e2e

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: e2e

      - name: Run end-to-end tests
        run: npx playwright test
        working-directory: e2e
        env:
          CI: 'true'

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

  # Dependency vulnerability scan (plan.md §29.1, §43.7).
  #
  # Runtime dependencies only (`--omit=dev`): a finding in test tooling never
  # ships to a user, and gating on it would train everyone to ignore the job.
  #
  # NON-BLOCKING for now, deliberately and temporarily. When this job was
  # added (2026-09-14) the audit already reported 1 critical / 11 high in
  # server/ and 2 critical / 9 high in client/, nearly all with fixes
  # available. Failing CI on day one would block every unrelated PR on an
  # upgrade nobody has reviewed; .github/dependabot.yml now opens those
  # upgrades as PRs instead. Remove `continue-on-error` once the backlog is
  # cleared — see plan.md §0.15.
  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    # Blocking per step, not per job (plan.md §0.15). The client audits clean
    # and must stay that way. The server still carries one high finding that
    # needs a semver-major upgrade (nodemailer 7 → 9), and pip-audit has never
    # been run against requirements.txt — those two steps report without
    # failing the build until they are cleared, then lose `continue-on-error`.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: npm audit — client (blocking)
        working-directory: client
        run: npm audit --omit=dev --audit-level=high

      - name: npm audit — server
        if: always()
        continue-on-error: true
        working-directory: server
        run: npm audit --omit=dev --audit-level=high

      - uses: actions/setup-python@v5
        if: always()
        with:
          python-version: '3.12'

      - name: pip-audit — AI service
        if: always()
        continue-on-error: true
        working-directory: fastapi-server
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt
